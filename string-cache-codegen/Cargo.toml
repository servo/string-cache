[package]
name = "string_cache_codegen"
version = "0.11.1"  # Also update ../README.md when making a semver-breaking change
authors = [ "The Servo Project Developers" ]
description = "A codegen library for string-cache, developed as part of the Servo project."
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/string-cache"
documentation = "https://docs.rs/string_cache_codegen/"
edition = "2024"

[lib]
name = "string_cache_codegen"
path = "lib.rs"

[dependencies]
phf_generator = { version = "0.14", features = ["ptrhash"] }
phf_shared = { version = "0.14", features = ["ptrhash"] }
proc-macro2 = "1"
quote = "1"
